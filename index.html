<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Sky Weather</title>
</head>

<body>

    <div id="weather-container">
        <h1 id="weather-title">Sky Weather</h1>
        <div id="weather-search-container">
            <label for="city-search" id="search-label">Enter the name of the desired city:</label>
            <input type="text" placeholder="search" id="city-search">
            <img src="./search.svg" alt="search icon" id="search-button">
        </div>
        <p id="loading-message">Loading...</p>

        <h2 id="city-name-info"></h2>
        <p id="temperature-info">temperature: <span id="city-temperature"></span></p>
        <p id="weather-info">weather: <span id="city-weather"></span></p>
        <p id="wind-speed-info">windSpeed: <span id="city-wind-speed"></span></p>
    </div>

    <script src="./script.js"></script>
</body>

</html>
